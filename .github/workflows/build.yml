name: Leaves CI

on:
  push:
    branches: [ 1.21.10 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false
      - name: Setup Git ConfigAdd commentMore actions
        run: |
          git config --global user.email "ci@leavesmc.org"
          git config --global user.name "LeavesMC CI"
      - name: Get Build Number
        run: bash scripts/GetBuildNumber.sh
      - name: Apply Patches
        run: ./gradlew applyAllPatches
      - name: Create Leavesclip Jar
        run: ./gradlew createMojmapLeavesclipJar
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
      - name: Get Release Info
        run: bash scripts/GetReleaseInfo.sh
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jar }}
          path: ${{ env.jar }}
